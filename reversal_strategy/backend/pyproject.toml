[project]
name = "reversal-strategy-backend"
version = "0.1.0"
description = "Reversal Strategy: long-only NSE futures swing strategy"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy>=2.0.0",
    # MySQL driver — only used when SWING_DB_URL is a mysql+pymysql:// URL; harmless
    # (pure-Python, tiny) for the default SQLite setup.
    "PyMySQL>=1.1.0",
    # Verifies Gateway user tokens locally with the shared JWT_SECRET (SSO).
    "PyJWT>=2.8.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    # Live Shoonya integration (optional in Phase 1 — mock gateway works without it):
    # "NorenRestApiOAuth",
    "psycopg[binary] (>=3.2)"
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0"
httpx = ">=0.27.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
