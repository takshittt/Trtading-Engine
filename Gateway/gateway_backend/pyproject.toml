[project]
name = "gateway-backend"
version = "0.1.0"
description = "Gateway: identity provider and the single broker session (Shoonya)"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv==1.0.0",
    "sqlalchemy>=2.0.0",
    "PyMySQL>=1.1.0",
    "requests==2.31.0",
    "pyotp>=2.9.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "selenium>=4.15.0",
    "cryptography>=42.0.0",
    "PyJWT>=2.8.0",
    "bcrypt>=4.1.0",
    "NorenRestApiOAuth",
    "rapidfuzz>=3.0.0",
    "psycopg[binary] (>=3.2)",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
